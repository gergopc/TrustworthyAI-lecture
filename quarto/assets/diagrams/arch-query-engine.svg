<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 330" id="arch-query-engine" class="diagram" role="img"
 aria-label="Each view in the browser sends SQL with a GROUP BY over binned x and y to a query engine such as DuckDB or DataFusion, which scans the tables and returns a small result with one row per bin; the engine can run on a server, in the kernel or in the browser">
<defs><marker id="arch-query-engine-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F2D2E"/></marker><marker id="arch-query-engine-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#960018"/></marker></defs>
