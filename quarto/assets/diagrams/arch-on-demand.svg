<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 330" id="arch-on-demand" class="diagram" role="img"
 aria-label="Browser sends the new x and y ranges to a Python server on every zoom or pan; the server runs datashader over all rows of the data and returns an image or one value per pixel">
<defs><marker id="arch-on-demand-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F2D2E"/></marker><marker id="arch-on-demand-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#960018"/></marker></defs>
<style>#arch-on-demand .t{font-size:24px;font-weight:700;fill:#2F2D2E;text-anchor:middle} #arch-on-demand .s{font-size:20px;fill:#2F2D2E;text-anchor:middle} #arch-on-demand .a{font-size:20px;font-style:italic;fill:#2F2D2E;text-anchor:middle} #arch-on-demand .ab{font-size:20px;font-style:italic;fill:#960018;text-anchor:middle} #arch-on-demand .a, #arch-on-demand .ab{paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round} #arch-on-demand .zb{font-size:22px;font-weight:700;fill:#960018;text-anchor:middle} #arch-on-demand .zs{font-size:22px;font-weight:700;fill:#1446A0;text-anchor:middle} #arch-on-demand .band{font-size:20px;font-weight:700;fill:#522B47}</style>
<text x="170" y="30" class="zs">Small Data</text>
<text x="1010" y="30" class="zb">Big Data</text>
