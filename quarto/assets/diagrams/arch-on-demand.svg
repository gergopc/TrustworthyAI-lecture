<text x="830.0" y="106" class="t">Python server</text>
<text x="830.0" y="142" class="s">HoloViews + datashader:</text>
<text x="830.0" y="170" class="s">aggregate + shade the</text>
<text x="830.0" y="198" class="s">visible x, y range</text>
