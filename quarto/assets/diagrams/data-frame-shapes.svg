<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" id="data-frame-shapes" class="diagram" role="img"
 aria-label="The same server metrics as a wide table, one row per server with columns cpu, mem and disk, and as a narrow table, one row per server and metric with a value column; melt turns wide into narrow, pivot turns it back">
<defs><marker id="dfs-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F2D2E"/></marker></defs>
<style>
#data-frame-shapes .t{font-size:26px;font-weight:700;fill:#2F2D2E}
#data-frame-shapes .s{font-size:20px;fill:#522B47;font-style:italic}
#data-frame-shapes .h{font-size:21px;font-weight:700;fill:#2F2D2E;text-anchor:middle}
#data-frame-shapes .c{font-size:21px;fill:#2F2D2E;text-anchor:middle}
#data-frame-shapes .k{font-size:21px;fill:#2F2D2E;text-anchor:middle;font-family:"Consolas","DejaVu Sans Mono",monospace}
#data-frame-shapes .op{font-size:22px;font-style:italic;fill:#2F2D2E;text-anchor:middle}
#data-frame-shapes .grid{stroke:#A7A8A7;stroke-width:1.5;fill:none}
#data-frame-shapes .cpu{fill:#1446A0;fill-opacity:.14}
#data-frame-shapes .mem{fill:#522B47;fill-opacity:.14}
#data-frame-shapes .disk{fill:#FB8B24;fill-opacity:.22}
#data-frame-shapes .hd{fill:#A7A8A7;fill-opacity:.35}
</style>
<!-- wide table: 4 columns × 120, header + 3 rows × 46, origin (20, 150) -->
<text x="20" y="80" class="t">Wide: one row per server</text>
<text x="20" y="112" class="s">a column per variable</text>
<rect x="20" y="150" width="480" height="46" class="hd"/>
<rect x="140" y="196" width="120" height="138" class="cpu"/>
<rect x="260" y="196" width="120" height="138" class="mem"/>
<rect x="380" y="196" width="120" height="138" class="disk"/>
<g class="grid">
<rect x="20" y="150" width="480" height="184"/>
<line x1="20" y1="196" x2="500" y2="196"/><line x1="20" y1="242" x2="500" y2="242"/><line x1="20" y1="288" x2="500" y2="288"/>
<line x1="140" y1="150" x2="140" y2="334"/><line x1="260" y1="150" x2="260" y2="334"/><line x1="380" y1="150" x2="380" y2="334"/>
</g>
<text x="80" y="181" class="h">server</text><text x="200" y="181" class="h">cpu %</text><text x="320" y="181" class="h">mem %</text><text x="440" y="181" class="h">disk %</text>
<text x="80" y="227" class="k">web-1</text><text x="200" y="227" class="c">71</text><text x="320" y="227" class="c">45</text><text x="440" y="227" class="c">80</text>
<text x="80" y="273" class="k">web-2</text><text x="200" y="273" class="c">64</text><text x="320" y="273" class="c">52</text><text x="440" y="273" class="c">77</text>
<text x="80" y="319" class="k">db-1</text><text x="200" y="319" class="c">38</text><text x="320" y="319" class="c">88</text><text x="440" y="319" class="c">91</text>
<!-- arrows -->
<line x1="560" y1="215" x2="760" y2="215" stroke="#2F2D2E" stroke-width="2.5" marker-end="url(#dfs-arrow)"/>
<text x="660" y="200" class="op">melt (unpivot)</text>
<line x1="760" y1="275" x2="560" y2="275" stroke="#2F2D2E" stroke-width="2.5" marker-end="url(#dfs-arrow)"/>
<text x="660" y="305" class="op">pivot</text>
<!-- narrow table: 3 columns (120, 130, 110), header + 9 rows × 34, origin (820, 88) -->
<text x="820" y="30" class="t">Narrow (long): one row per measurement</text>
<text x="820" y="62" class="s">variable names become data</text>
<rect x="820" y="88" width="360" height="40" class="hd"/>
<rect x="940" y="128" width="240" height="34" class="cpu"/><rect x="940" y="162" width="240" height="34" class="mem"/><rect x="940" y="196" width="240" height="34" class="disk"/>
<rect x="940" y="230" width="240" height="34" class="cpu"/><rect x="940" y="264" width="240" height="34" class="mem"/><rect x="940" y="298" width="240" height="34" class="disk"/>
<rect x="940" y="332" width="240" height="34" class="cpu"/><rect x="940" y="366" width="240" height="34" class="mem"/>
<g class="grid">
<rect x="820" y="88" width="360" height="312"/>
<line x1="820" y1="128" x2="1180" y2="128"/><line x1="820" y1="162" x2="1180" y2="162"/><line x1="820" y1="196" x2="1180" y2="196"/>
<line x1="820" y1="230" x2="1180" y2="230"/><line x1="820" y1="264" x2="1180" y2="264"/><line x1="820" y1="298" x2="1180" y2="298"/>
<line x1="820" y1="332" x2="1180" y2="332"/><line x1="820" y1="366" x2="1180" y2="366"/>
<line x1="940" y1="88" x2="940" y2="400"/><line x1="1070" y1="88" x2="1070" y2="400"/>
</g>
<text x="880" y="115" class="h">server</text><text x="1005" y="115" class="h">metric</text><text x="1125" y="115" class="h">value</text>
<text x="880" y="152" class="k">web-1</text><text x="1005" y="152" class="k">cpu</text><text x="1125" y="152" class="c">71</text>
<text x="880" y="186" class="k">web-1</text><text x="1005" y="186" class="k">mem</text><text x="1125" y="186" class="c">45</text>
<text x="880" y="220" class="k">web-1</text><text x="1005" y="220" class="k">disk</text><text x="1125" y="220" class="c">80</text>
<text x="880" y="254" class="k">web-2</text><text x="1005" y="254" class="k">cpu</text><text x="1125" y="254" class="c">64</text>
<text x="880" y="288" class="k">web-2</text><text x="1005" y="288" class="k">mem</text><text x="1125" y="288" class="c">52</text>
<text x="880" y="322" class="k">web-2</text><text x="1005" y="322" class="k">disk</text><text x="1125" y="322" class="c">77</text>
<text x="880" y="356" class="k">db-1</text><text x="1005" y="356" class="k">cpu</text><text x="1125" y="356" class="c">38</text>
<text x="880" y="390" class="k">db-1</text><text x="1005" y="390" class="k">…</text><text x="1125" y="390" class="c">…</text>
<text x="1200" y="250" class="s">grows in rows,</text>
<text x="1200" y="278" class="s">fixed columns</text>
</svg>
