<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 410" id="arch-precompute" class="diagram" role="img"
 aria-label="Ahead of time a batch job aggregates all rows at every zoom level into a tile pyramid or data cube, stored on a tile server; on each interaction the browser fetches the tiles of its viewport, a lookup without a pass over the rows">
