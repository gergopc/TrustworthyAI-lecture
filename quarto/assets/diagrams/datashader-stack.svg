<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" id="datashader-stack" class="diagram" role="img"
 aria-label="The software stack of today's demo, top to bottom: Jupyter notebook or Panel app; HoloViews and Bokeh for interactive plots; Datashader; pandas, xarray and Numba; Dask for parallel and out-of-core work and cuDF or CuPy for GPUs; hardware from laptop cores to clusters and GPUs">
<style>
#datashader-stack .n{font-size:24px;font-weight:700;fill:#2F2D2E;text-anchor:middle}
#datashader-stack .d{font-size:19px;fill:#2F2D2E;text-anchor:middle}
#datashader-stack .side{font-size:20px;font-weight:700;text-anchor:middle}
</style>
<rect x="60" y="10" width="540" height="76" rx="10" fill="#1446A0" fill-opacity="0.10" stroke="#1446A0" stroke-width="1.5"/>
<text x="330" y="44" class="n">Jupyter notebook · Panel app</text>
<text x="330" y="72" class="d">where you type and see (our live slides: Panel)</text>
<rect x="60" y="96" width="540" height="76" rx="10" fill="#1446A0" fill-opacity="0.10" stroke="#1446A0" stroke-width="1.5"/>
<text x="330" y="130" class="n">HoloViews + Bokeh</text>
<text x="330" y="158" class="d">interactive plots, zoom and pan, legends</text>
<rect x="60" y="182" width="540" height="90" rx="10" fill="#FB8B24" fill-opacity="0.28" stroke="#C45F00" stroke-width="2.5"/>
<text x="330" y="220" class="n">Datashader</text>
<text x="330" y="252" class="d">Canvas → aggregate → shade</text>
<rect x="60" y="282" width="540" height="76" rx="10" fill="#522B47" fill-opacity="0.10" stroke="#522B47" stroke-width="1.5"/>
<text x="330" y="316" class="n">pandas · xarray · Numba</text>
<text x="330" y="344" class="d">data frames, grids, compiled aggregation loops</text>
<rect x="60" y="368" width="540" height="76" rx="10" fill="#960018" fill-opacity="0.08" stroke="#960018" stroke-width="1.5"/>
<text x="330" y="402" class="n">Dask · cuDF / CuPy</text>
<text x="330" y="430" class="d">parallel and out of core · on the GPU</text>
<rect x="60" y="454" width="540" height="76" rx="10" fill="#A7A8A7" fill-opacity="0.25" stroke="#A7A8A7" stroke-width="1.5"/>
<text x="330" y="488" class="n">cores, GPUs, clusters</text>
<text x="330" y="516" class="d">from this laptop to a data centre</text>
<text x="24" y="140" class="side" fill="#1446A0" transform="rotate(-90 24 140)">Small Data</text>
<text x="24" y="420" class="side" fill="#960018" transform="rotate(-90 24 420)">Big Data</text>
<line x1="44" y1="277" x2="600" y2="277" stroke="#FB8B24" stroke-width="3" stroke-dasharray="10 7"/>
</svg>
